<section class="form-panel" aria-labelledby="form-title">
  <h2 id="form-title">{{ editing ? 'Editar tarea' : 'Crear tarea' }}</h2>
  <p *ngIf="error" class="error-message" role="alert">{{ error }}</p>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="task-title">Título</label>
    <input id="task-title" type="text" formControlName="title" maxlength="100" aria-describedby="title-error" />
    <p id="title-error" *ngIf="errorFor('title')" class="field-error">{{ errorFor('title') }}</p>
    <label for="task-description">Descripción</label>
    <textarea id="task-description" formControlName="description" maxlength="500" rows="4" aria-describedby="description-error"></textarea>
    <p id="description-error" *ngIf="errorFor('description')" class="field-error">{{ errorFor('description') }}</p>
    <label for="task-status">Estado</label>
    <select id="task-status" formControlName="status" aria-describedby="status-error">
      <option *ngFor="let status of statuses" [value]="status">{{ labels[status] }}</option>
    </select>
    <p id="status-error" *ngIf="errorFor('status')" class="field-error">{{ errorFor('status') }}</p>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit" [disabled]="loading">{{ loading ? 'Guardando...' : editing ? 'Actualizar' : 'Crear' }}</button>
      <button class="btn btn-secondary" type="button" (click)="cancelled.emit()" [disabled]="loading">Cancelar</button>
    </div>
  </form>
</section>
